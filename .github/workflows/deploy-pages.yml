name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Optional full commit SHA to check without publishing'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && !inputs.candidate_sha && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'github-pages' || format('github-pages-checks-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Validate candidate revision
        if: inputs.candidate_sha != ''
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'candidate_sha must be a full 40-character commit SHA.' >&2
            exit 1
          fi
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Report revisions
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          printf 'Workflow SHA: %s\n' "$WORKFLOW_SHA"
          printf 'Checked-out SHA: %s\n' "$(git rev-parse HEAD)"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun test
      - name: Build
        run: bun run build
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && !inputs.candidate_sha && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/configure-pages@v6
      - name: Upload site
        if: github.ref == 'refs/heads/main' && !inputs.candidate_sha && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && !inputs.candidate_sha && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4

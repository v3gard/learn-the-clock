version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      lint-and-typescript:
        patterns:
          - eslint
          - "@eslint/*"
          - eslint-plugin-*
          - globals
          - typescript
          - typescript-eslint
      build-tools:
        patterns:
          - vite
          - "@vitejs/*"
          - "@babel/*"
          - "@types/babel__core"
          - "@rolldown/*"
          - babel-plugin-react-compiler
      pwa:
        patterns:
          - vite-plugin-pwa
          - workbox-*
    ignore:
      # Remove once typescript-eslint supports TypeScript 7.
      - dependency-name: typescript
        versions: ["7.x"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
